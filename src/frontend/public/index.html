<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Filler - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }

        .controls {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .session-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .session-card:hover {
            transform: translateY(-5px);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .session-id {
            font-weight: bold;
            color: #333;
            font-size: 12px;
            font-family: monospace;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.ready { background: #e3f2fd; color: #1976d2; }
        .status-badge.active { background: #e8f5e9; color: #388e3c; }
        .status-badge.searching { background: #fff3e0; color: #f57c00; }
        .status-badge.manual_action_required { background: #ffebee; color: #d32f2f; }
        .status-badge.error { background: #ffcdd2; color: #c62828; }

        .session-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .session-stat {
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .session-stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .session-stat-label {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
        }

        .session-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .session-actions button {
            flex: 1;
            padding: 8px 16px;
            font-size: 12px;
        }

        .notifications {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .notifications h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .notification {
            padding: 12px;
            border-left: 4px solid;
            margin-bottom: 10px;
            border-radius: 4px;
            background: #f5f5f5;
        }

        .notification.info { border-color: #2196f3; }
        .notification.warning { border-color: #ff9800; }
        .notification.error { border-color: #f44336; }
        .notification.success { border-color: #4caf50; }

        .notification-time {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
        }

        .notification-session {
            font-size: 11px;
            color: #999;
            font-family: monospace;
        }

        .notification-message {
            color: #333;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .connection-dot.disconnected {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 Auto Filler Dashboard</h1>
                <div class="connection-status">
                    <div class="connection-dot" id="connectionDot"></div>
                    <span id="connectionStatus">Connecting...</span>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat">
                    <div class="stat-value" id="totalSessions">0</div>
                    <div class="stat-label">Total Sessions</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="activeSessions">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalJobs">0</div>
                    <div class="stat-label">Jobs Found</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <button onclick="createSession()" id="createSessionBtn">
                ➕ Create New Browser Session
            </button>
        </div>

        <div class="sessions-grid" id="sessionsGrid">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: #666;">Loading sessions...</p>
            </div>
        </div>

        <div class="notifications">
            <h2>📢 Recent Notifications</h2>
            <div id="notificationsList">
                <div class="empty-state">
                    <div class="empty-state-icon">🔔</div>
                    <p>No notifications yet</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        const WS_URL = 'ws://localhost:3001';
        let ws = null;
        let sessions = [];
        let notifications = [];

        // Initialize WebSocket connection
        function connectWebSocket() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('WebSocket connected');
                updateConnectionStatus(true);
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleWebSocketMessage(message);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateConnectionStatus(false);
                // Reconnect after 3 seconds
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateConnectionStatus(false);
            };
        }

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connectionDot');
            const status = document.getElementById('connectionStatus');
            
            if (connected) {
                dot.classList.remove('disconnected');
                status.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                status.textContent = 'Disconnected';
            }
        }

        function handleWebSocketMessage(message) {
            console.log('WebSocket message:', message);

            switch (message.type) {
                case 'initial_state':
                    sessions = message.data;
                    renderSessions();
                    updateStats();
                    break;
                case 'session_created':
                case 'session_updated':
                    updateSession(message.data);
                    break;
                case 'session_deleted':
                    removeSession(message.data.id);
                    break;
                case 'notification':
                    addNotification(message.data);
                    break;
            }
        }

        function updateSession(sessionData) {
            const index = sessions.findIndex(s => s.id === sessionData.id);
            if (index >= 0) {
                sessions[index] = sessionData;
            } else {
                sessions.push(sessionData);
            }
            renderSessions();
            updateStats();
        }

        function removeSession(sessionId) {
            sessions = sessions.filter(s => s.id !== sessionId);
            renderSessions();
            updateStats();
        }

        function addNotification(data) {
            notifications.unshift({
                ...data.notification,
                sessionId: data.sessionId
            });
            // Keep only last 50 notifications
            notifications = notifications.slice(0, 50);
            renderNotifications();
        }

        function updateStats() {
            document.getElementById('totalSessions').textContent = sessions.length;
            document.getElementById('activeSessions').textContent = 
                sessions.filter(s => s.status === 'active' || s.status === 'searching').length;
            
            const totalJobs = sessions.reduce((sum, s) => sum + (s.stats?.jobsFound || 0), 0);
            document.getElementById('totalJobs').textContent = totalJobs;
        }

        function renderSessions() {
            const grid = document.getElementById('sessionsGrid');
            
            if (sessions.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🖥️</div>
                        <p>No active browser sessions</p>
                        <p style="font-size: 14px; margin-top: 10px;">Create a new session to get started</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = sessions.map(session => `
                <div class="session-card">
                    <div class="session-header">
                        <span class="session-id">${session.id.substring(0, 8)}...</span>
                        <span class="status-badge ${session.status}">${session.status}</span>
                    </div>
                    
                    <div class="session-stats">
                        <div class="session-stat">
                            <div class="session-stat-value">${session.stats?.jobsFound || 0}</div>
                            <div class="session-stat-label">Jobs Found</div>
                        </div>
                        <div class="session-stat">
                            <div class="session-stat-value">${session.stats?.formsAutofilled || 0}</div>
                            <div class="session-stat-label">Autofilled</div>
                        </div>
                        <div class="session-stat">
                            <div class="session-stat-value">${session.stats?.manualActionsRequired || 0}</div>
                            <div class="session-stat-label">Manual Actions</div>
                        </div>
                    </div>

                    <div style="font-size: 11px; color: #666; margin: 10px 0;">
                        Created: ${new Date(session.createdAt).toLocaleString()}
                    </div>

                    <div class="session-actions">
                        <button onclick="startSearch('${session.id}')" 
                                ${session.searchStatus === 'active' ? 'disabled' : ''}>
                            🔍 Start Search
                        </button>
                        <button onclick="takeScreenshot('${session.id}')">
                            📸 Screenshot
                        </button>
                        <button onclick="closeSession('${session.id}')" 
                                style="background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);">
                            ❌ Close
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderNotifications() {
            const list = document.getElementById('notificationsList');
            
            if (notifications.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔔</div>
                        <p>No notifications yet</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = notifications.map(notif => `
                <div class="notification ${notif.type}">
                    <div class="notification-time">${new Date(notif.timestamp).toLocaleString()}</div>
                    <div class="notification-session">Session: ${notif.sessionId?.substring(0, 8)}...</div>
                    <div class="notification-message">${notif.message}</div>
                    ${notif.url ? `<a href="${notif.url}" target="_blank" style="font-size: 12px; color: #667eea;">View Page</a>` : ''}
                </div>
            `).join('');
        }

        // API Functions
        async function createSession() {
            const btn = document.getElementById('createSessionBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Creating session...';

            try {
                const response = await fetch(`${API_URL}/api/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                
                if (data.success) {
                    console.log('Session created:', data.session);
                } else {
                    alert('Failed to create session: ' + data.error);
                }
            } catch (error) {
                console.error('Error creating session:', error);
                alert('Failed to create session. Make sure the backend is running.');
            } finally {
                btn.disabled = false;
                btn.textContent = '➕ Create New Browser Session';
            }
        }

        async function startSearch(sessionId) {
            try {
                const response = await fetch(`${API_URL}/api/sessions/${sessionId}/search`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (!data.success) {
                    alert('Failed to start search: ' + data.error);
                }
            } catch (error) {
                console.error('Error starting search:', error);
                alert('Failed to start search');
            }
        }

        async function takeScreenshot(sessionId) {
            try {
                window.open(`${API_URL}/api/sessions/${sessionId}/screenshot`, '_blank');
            } catch (error) {
                console.error('Error taking screenshot:', error);
            }
        }

        async function closeSession(sessionId) {
            if (!confirm('Are you sure you want to close this session?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/sessions/${sessionId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (!data.success) {
                    alert('Failed to close session: ' + data.error);
                }
            } catch (error) {
                console.error('Error closing session:', error);
                alert('Failed to close session');
            }
        }

        async function loadSessions() {
            try {
                const response = await fetch(`${API_URL}/api/sessions`);
                sessions = await response.json();
                renderSessions();
                updateStats();
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }

        // Initialize
        connectWebSocket();
        loadSessions();
    </script>
</body>
</html>
