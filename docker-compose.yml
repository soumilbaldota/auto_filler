version: '3.8'

services:
  auto-filler-backend:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./browser-data:/app/browser-data
      - ./extensions:/app/extensions
      - ./screenshots:/app/screenshots
    restart: unless-stopped
    networks:
      - auto-filler-network

networks:
  auto-filler-network:
    driver: bridge
